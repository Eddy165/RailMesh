[project]
name = "railmesh-backend"
version = "0.1.0"
description = "RailMesh backend for delay cascade simulator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "pydantic>=2.6.0",
    "langgraph>=0.0.30",
    "langchain-google-genai>=1.0.0",
    "networkx>=3.2.1",
    "mcp>=0.1.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0"
]
